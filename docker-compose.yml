name: kb-workbench

services:
  backend:
    # build.args.INSTALL_UPGRADE_TOOLS —— 「一键升级」能不能用的总开关
    #
    #   0（默认）：镜像里没有 git / docker CLI。「检查更新」照常可用；
    #               「一键升级」接口会如实报出「容器里没有 git / 没有 docker」，
    #               并给出确切的手动命令，不会假装失败。
    #   1：额外装上 git + docker CLI + compose 插件（镜像会大 90MB 左右），
    #      容器内才有能力自己跑完 fetch → checkout → build → up 这四步。
    #
    # 想用一键升级，要做三件事：
    #   1) 把下面 INSTALL_UPGRADE_TOOLS 改成 1（或在 .env 里设
    #      KB_INSTALL_UPGRADE_TOOLS=1），然后重建后端镜像；
    #   2) 打开下面 volumes 里注释掉的两行（项目目录 + docker.sock），
    #      并在 environment 里放开 KB_PROJECT_DIR=/app/project；
    #   3) git commit 这次改动 —— 一键升级会 checkout 到目标 tag，
    #      未提交的本地改动会被覆盖，接口也会因为「工作区不干净」拒绝升级。
    #
    # 提醒：挂载 docker.sock 等于把宿主机的 root 权限交给容器，
    #       只在可信环境开启。
    build:
      context: ./backend
      args:
        INSTALL_UPGRADE_TOOLS: ${KB_INSTALL_UPGRADE_TOOLS:-0}
    container_name: kb-backend
    restart: unless-stopped
    # 本地 .env 覆盖默认值（可选）。所有可调项见 .env.example。
    # 只写文件名的字符串形式。对象形式（path: / required:）要 Compose v2.24+，
    # 老版本会直接报 "services.backend.env_file.0 must be a string" 起不来。
    # .env 由 .env.example 复制而来，一定存在。
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      # 元数据 + 索引（kb.db）。可用 KB_DATA_DIR 指到别的盘，
      # 安装目录本身只有几百 KB，换盘只搬数据、不用重装。
      - ${KB_DATA_DIR:-./data}:/app/data
      # 文件原文（v0.3 起外置到文件系统）。与 data 同盘即可，
      # 但应当和「备份目录」分属不同物理盘，否则单盘故障会同时带走两者。
      - ${KB_FILE_STORE_DIR:-./files}:/app/files
      # 备份目录：默认 ./backups。
      # 同盘备份只防误删、不防磁盘故障 —— 生产请指向另一块物理盘或网络存储。
      - ${KB_BACKUP_DIR:-./backups}:/app/backups
      # 第二块盘的挂载位：只要把宿主机上另一块物理盘 / NAS 挂到这里，
      # 「系统设置 → 备份目录」的下拉里就会直接出现它，点一下即可切换，
      # 不用改 compose 结构、也不用重启容器。
      - ${KB_BACKUP_ALT_HOST_DIR:-./backups-alt}:/mnt/kb-backup
      # ==== 一键升级需要的挂载（默认关闭，按需打开）====
      # 项目目录：容器要在这里跑 git fetch / checkout，所以必须带着 .git
      #           和编排文件一起挂进来。
      # - .:/app/project
      # docker.sock：让容器能操作宿主机的容器（build / up）。
      #              等于把宿主机 root 权限交给容器，只在可信环境开启。
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/kb.db
      - DATA_DIR=/app/data
      - KB_FILE_STORE=${KB_FILE_STORE:-fs}
      - KB_FILE_STORE_DIR=/app/files
      # 这一项只是「没在界面上设置过」时的兜底值。
      # 界面上的「系统设置 → 备份目录」优先级更高，改完立即生效。
      - KB_BACKUP_DIR=/app/backups
      - BACKUP_KEEP=${KB_BACKUP_KEEP:-14}
      # 声明 /mnt/kb-backup 在宿主机上是独立于数据盘的备份盘。
      # Docker Desktop 下容器无法自动判断（所有挂载都是同一个伪设备），
      # 所以要让系统知道，否则界面只能给「与数据同盘」的保守提醒。
      - BACKUP_SEPARATE_MOUNTS=/mnt/kb-backup
      # 仅用于首次启动时的存量迁移（把旧磁盘附件搬进文档库）
      - LEGACY_UPLOAD_DIR=/app/data/uploads
      - APP_ENV=production
      # 单文件超过该体积时在上传结果里提示（不阻止上传）
      - LARGE_FILE_WARN_MB=200
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-1024}
      # 一键升级用的项目目录（**容器内**路径）。
      # 只有打开了上面 volumes 里注释掉的项目目录挂载时才有意义，
      # 所以默认不设 —— 设了但没挂载，只会让接口报「找不到项目目录」。
      # - KB_PROJECT_DIR=/app/project
      # ==== SQLite 调优（详见 backend/app/config.py 注释）====
      - SQLITE_CACHE_MB=${SQLITE_CACHE_MB:-64}
      - SQLITE_MMAP_MB=${SQLITE_MMAP_MB:-256}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    # 关停顺序需要时间：要先停维护循环 → 释放连接 → PRAGMA optimize +
    # WAL 截断。默认 10 秒常常不够（库大时更明显），被 SIGKILL 掉就
    # 等于跳过了关停维护，下次启动要花时间恢复 WAL。
    stop_grace_period: 60s
    networks:
      default:
        aliases:
          # 显式声明服务别名。compose 默认也会注册它，但那是隐式副作用：
          # 容器被手工 reconnect 到网络、或用别的方式挂载时，别名会丢，
          # 前端就会报 "host not found in upstream backend"。
          # 写进服务定义里，它就是容器规格的一部分，不容易丢。
          - backend
    # 日志不轮转会一路涨到把磁盘写满 —— 容器场景下这是真实的故障源
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build: ./frontend
    container_name: kb-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      # 后端上游地址（host:port）。默认走同一个 compose 网络里的 backend 服务。
      # 前端与后端不在同一个网络时，把它指到实际地址即可，不必重新构建镜像。
      - KB_BACKEND_ADDR=${KB_BACKEND_ADDR:-backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
