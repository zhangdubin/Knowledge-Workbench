server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 基础安全头。这几个头对纯前端 SPA 无副作用，但不加就等于把
    # 点击劫持、MIME 嗅探这类低门槛攻击面留在生产上。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # 容器健康检查专用端点：不读磁盘、不碰后端，
    # 只回答「nginx 还在正常接受连接吗」。
    # 用它而不是 `/` 的原因：`/` 走 SPA fallback 会去读 index.html，
    # 万一静态目录出了问题，健康检查会连带失败，掩盖真正的原因。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的构建产物可以长期缓存；index.html 必须不缓存，
    # 否则发版后用户会一直拿到旧入口。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 反代后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 上传体积上限必须与后端 UPLOAD_MAX_MB 对齐。
        # 这里若小于后端，用户会拿到 nginx 的 413 页面（不是统一 JSON 错误体），
        # 前端无法解析、只能显示「网络错误」——排查起来很费时。
        # 默认 4096m（4GB）：覆盖几乎所有真实大文件场景，又不至于让进程
        # 内存压力过大（结合 proxy_request_buffering off，不写临时目录）。
        client_max_body_size 4096m;
        # 大文件上传不要缓冲到 nginx 临时目录再转发：
        # 那等于同一份数据先写一次盘、再读一次，还多占一份磁盘。
        proxy_request_buffering off;
        # 下载走流式（支持 Range），不要缓冲整份响应
        proxy_buffering off;
    }
}
