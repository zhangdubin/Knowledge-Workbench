server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 基础安全头。这几个头对纯前端 SPA 无副作用，但不加就等于把
    # 点击劫持、MIME 嗅探这类低门槛攻击面留在生产上。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # ---- 后端上游：延迟解析 ----
    #
    # 为什么不能直接写 `proxy_pass http://backend:8000`：
    # nginx 在**加载配置时**一次性把 upstream 的主机名解析成 IP，
    # 解析不到就直接 `[emerg] host not found in upstream` 退出进程。
    # 于是只要出现下面任一情况，前端容器就会陷入崩溃重启循环：
    #   - 后端容器还没起来（compose 之外单独拉起前端）
    #   - 后端容器被重建（IP 变了，但名字一样）
    #   - 后端临时停掉，Docker 顺手把前端也重启了
    # 服务器上看到的那串 "[emerg] host not found in upstream backend"
    # 加上越来越长的重启间隔，就是这个循环。
    #
    # 改成「resolver + 变量」之后：
    #   - 启动不再依赖后端在不在，后端晚起来能自动接上
    #   - 后端换 IP 后，nginx 在 valid 周期内重新解析，不会一直 502
    #   - 后端临时不可用时前端照常出页面，接口给出明确的 JSON 错误
    #
    # resolver 用 127.0.0.11 —— Docker 内嵌 DNS，只在宿主机内解析，
    # 不会把内网主机名泄露到公网（这个项目是私有部署，不该外发 DNS）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 容器健康检查专用端点：不读磁盘、不碰后端，
    # 只回答「nginx 还在正常接受连接吗」。
    # 用它而不是 `/` 的原因：`/` 走 SPA fallback 会去读 index.html，
    # 万一静态目录出了问题，健康检查会连带失败，掩盖真正的原因。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的构建产物可以长期缓存；index.html 必须不缓存，
    # 否则发版后用户会一直拿到旧入口。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 反代后端
    location /api/ {
        # 上游地址。默认 backend:8000（compose 网络里的服务名），
        # 需要改成别的（前端与后端不在同一个 compose 网络、
        # 或后端跑在另一台机器上）时，用环境变量 KB_BACKEND_ADDR 覆盖，
        # 不用重新构建镜像。
        #
        # 注意 proxy_pass 用变量后，nginx 不再在启动时解析它，
        # 而是每次请求时按上面的 resolver 解析 —— 这正是我们要的。
        set $kb_backend "http://${KB_BACKEND_ADDR}";

        proxy_pass $kb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 上传体积上限必须与后端 UPLOAD_MAX_MB 对齐。
        # 这里若小于后端，用户会拿到 nginx 的 413 页面（不是统一 JSON 错误体），
        # 前端无法解析、只能显示「网络错误」——排查起来很费时。
        # 默认 4096m（4GB）：覆盖几乎所有真实大文件场景，又不至于让进程
        # 内存压力过大（结合 proxy_request_buffering off，不写临时目录）。
        client_max_body_size 4096m;
        # 大文件上传不要缓冲到 nginx 临时目录再转发：
        # 那等于同一份数据先写一次盘、再读一次，还多占一份磁盘。
        proxy_request_buffering off;
        # 下载走流式（支持 Range），不要缓冲整份响应
        proxy_buffering off;

        # 连不上后端时，nginx 默认回一个 HTML 错误页；
        # 前端只认 JSON，拿到 HTML 只能显示「网络错误」，排查时看不到原因。
        # 这里换成明确的 JSON。注意 proxy_intercept_errors 默认是 off，
        # 所以**后端自己返回的** 4xx/5xx 仍原样透传，不受影响。
        error_page 502 503 504 = @kb_backend_down;
    }

    location @kb_backend_down {
        default_type application/json;
        return 503 '{"ok":false,"detail":"后端服务暂时不可用（可能正在启动或刚重启），请稍后重试；若持续失败，请检查后端容器是否在运行、且与前端处于同一个 Docker 网络"}';
    }
}
